weather_dwh:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'postgres') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | int }}"
      user: "{{ env_var('WAREHOUSE_USER', 'weather') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD', 'weather') }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'weather') }}"
      schema: staging
      threads: 4
